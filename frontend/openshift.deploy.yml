# Frontend deploy template — consumed by `oc process` in reusable-deploy.yml.
#
# Public CSS settings are mounted in /config.js at runtime; images are environment-neutral.
# BACKEND_URL selects the API proxy; the issuer ConfigMap bounds CSS requests.
#
# The runtime-config ConfigMap this Deployment mounts is created by
# common/openshift.init.yml (init step), where environment-scoped GitHub
# variables resolve correctly — see the note there before moving it back.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: nr-csp-frontend-deploy
parameters:
  - name: NAME
    description: App name prefix
    value: nr-csp
  - name: ZONE
    description: PR number, 'test', or 'prod'
    required: true
  - name: IMAGE_TAG
    description: Container image tag (PR number, 'test', or 'prod')
    value: latest
  # PR deploys pass the immutable head SHA as IMAGE_TAG, so every push changes
  # the pod spec and forces a rollout. Test/prod deploys (merge.yml) still use
  # the mutable PR-number tag, where `oc apply` would otherwise see an
  # unchanged Deployment and keep serving the stale image despite
  # imagePullPolicy: Always — there the commit stamp below forces the rollout.
  - name: COMMIT_SHA
    description: Git commit stamped on the pod template to force a rollout per push
    value: ""
  - name: REGISTRY
    description: Image registry path (no tag)
    value: ghcr.io/bcgov/nr-csp/frontend
  - name: DOMAIN
    description: Cluster apps domain (no leading dot)
    value: apps.gold.devops.gov.bc.ca

objects:
  # ── Deployment ────────────────────────────────────────────
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${NAME}-frontend-${ZONE}
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/name: ${NAME}-frontend
        app.kubernetes.io/instance: ${ZONE}
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: ${NAME}-frontend-${ZONE}
      template:
        metadata:
          labels:
            app: ${NAME}-frontend-${ZONE}
            app.kubernetes.io/instance: ${ZONE}
          annotations:
            app.openshift.io/vcs-ref: ${COMMIT_SHA}
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
          containers:
            - name: ${NAME}-frontend
              image: ${REGISTRY}:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 3000
              env:
                # Caddy reverse-proxies /api/* to the same-zone backend Service.
                - name: BACKEND_URL
                  value: ${NAME}-backend-${ZONE}:8080
                # Environment-specific issuer also bounds browser token/discovery requests.
                - name: OIDC_ISSUER_URI
                  valueFrom:
                    configMapKeyRef:
                      name: ${NAME}-${ZONE}-frontend
                      key: OIDC_ISSUER_URI
                # Caddy runtime log verbosity (see Caddyfile global options).
                # Comes from the init-created ConfigMap so the value honors
                # environment-scoped GitHub variables (see openshift.init.yml).
                - name: LOG_LEVEL
                  valueFrom:
                    configMapKeyRef:
                      name: ${NAME}-${ZONE}-frontend
                      key: LOG_LEVEL
              volumeMounts:
                - name: caddy-data
                  mountPath: /data
                - name: caddy-config
                  mountPath: /config
                - name: tmp
                  mountPath: /tmp
                - name: runtime-config
                  mountPath: /usr/share/caddy/config.js
                  subPath: config.js
                  readOnly: true
              resources:
                requests:
                  cpu: "20m"
                  memory: "64Mi"
                  ephemeral-storage: "100Mi"
              livenessProbe:
                httpGet:
                  path: /health
                  port: 3000
                initialDelaySeconds: 10
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3
              readinessProbe:
                httpGet:
                  path: /health
                  port: 3000
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 5
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: caddy-data
              emptyDir: {}
            - name: caddy-config
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: runtime-config
              configMap:
                name: ${NAME}-frontend-config-${ZONE}

  # ── Service ───────────────────────────────────────────────
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${NAME}-frontend-${ZONE}
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      selector:
        app: ${NAME}-frontend-${ZONE}
      ports:
        - name: http
          protocol: TCP
          port: 3000
          targetPort: 3000

  # ── Route ─────────────────────────────────────────────────
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${NAME}-frontend-${ZONE}
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
      annotations:
        # The frontend is a stateless static server + reverse proxy, so it needs no
        # session affinity. Without this, the HAProxy router injects a balancing
        # cookie on every response — flagged by security scans as a SameSite=None
        # cookie. Disabling it removes the cookie at the source.
        haproxy.router.openshift.io/disable_cookies: "true"
    spec:
      host: ${NAME}-${ZONE}.${DOMAIN}
      to:
        kind: Service
        name: ${NAME}-frontend-${ZONE}
      port:
        targetPort: http
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
