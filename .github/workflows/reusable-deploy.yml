# Reusable Deploy - Lite Mode Verification
name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub/OpenShift environment
        default: ""
        type: string
      target:
        description: Deployment target; usually PR number, test or prod
        default: ${{ github.event.number }}
        type: string
      tag:
        description: Container tag
        default: ${{ github.event.number }}
        type: string
      triggers:
        description: Triggers for deployment
        default: ""
        type: string

    secrets:
      oc_namespace:
        description: OpenShift namespace
        required: true
      oc_token:
        description: OpenShift token
        required: true
      # Backend secrets
      spring_datasource_url:
        description: Oracle JDBC URL
        required: true
      spring_datasource_username:
        description: Oracle database username
        required: true
      spring_datasource_password:
        description: Oracle database password
        required: true
      keystore_secret:
        description: Oracle wallet init container secret
        required: true
      # Backend config
      database_host:
        description: Oracle DB hostname
        required: true
      database_service_name:
        description: Oracle service name
        required: true

    outputs:
      triggered:
        description: Has deployment been triggered?
        value: ${{ jobs.init.outputs.triggered }}

permissions: {}

jobs:
  init:
    name: Deploy (init)
    environment: ${{ inputs.environment }}
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    runs-on: ubuntu-24.04
    env:
      DB_JDBC_URL: ${{ secrets.spring_datasource_url }}
      DB_USER: ${{ secrets.spring_datasource_username }}
      DB_PASS: ${{ secrets.spring_datasource_password }}
      DB_WALLET_PASSWORD: ${{ secrets.keystore_secret }}
      DB_HOST: ${{ secrets.database_host }}
      DB_SERVICE_NAME: ${{ secrets.database_service_name }}
    steps:
      - name: Validate SSO configuration
        env:
          OIDC_ISSUER_URI: ${{ vars.CSP_OIDC_ISSUER_URI }}
          OIDC_CLIENT_ID: ${{ vars.CSP_OIDC_CLIENT_ID }}
        run: |
          if [[ ! "$OIDC_ISSUER_URI" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/(auth/)?realms/[A-Za-z0-9._-]+$ ]] ||
             [[ ! "$OIDC_CLIENT_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::CSP_OIDC_ISSUER_URI and CSP_OIDC_CLIENT_ID must identify the provisioned CSS client"
            exit 1
          fi
      - uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        id: deploy
        with:
          file: common/openshift.init.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          overwrite: true
          parameters:
            -p ZONE='${{ inputs.target }}'
            -p NAME='${{ github.event.repository.name }}'
            -p SPRING_DATASOURCE_URL="$DB_JDBC_URL"
            -p SPRING_DATASOURCE_USERNAME="$DB_USER"
            -p SPRING_DATASOURCE_PASSWORD="$DB_PASS"
            -p KEYSTORE_SECRET="$DB_WALLET_PASSWORD"
            -p DATABASE_HOST="$DB_HOST"
            -p DATABASE_SERVICE_NAME="$DB_SERVICE_NAME"
            -p FRONTEND_LOG_LEVEL='${{ vars.frontend_log_level || 'INFO' }}'
            -p CSP_OIDC_ISSUER_URI='${{ vars.CSP_OIDC_ISSUER_URI }}'
            -p CSP_OIDC_CLIENT_ID='${{ vars.CSP_OIDC_CLIENT_ID }}'
            -p APP_ENV='${{ inputs.environment || 'dev' }}'
            -p OIDC_IDIR_HINT='${{ vars.CSP_OIDC_IDIR_HINT || 'azureidir' }}'
            -p OIDC_BCEID_HINT='${{ vars.CSP_OIDC_BCEID_HINT || 'bceidbusiness' }}'
            -p OIDC_SITEMINDER_LOGOUT_URL='${{ vars.CSP_OIDC_SITEMINDER_LOGOUT_URL }}'
          triggers: ${{ inputs.triggers }}
          debug: true

  deploy:
    name: Deploy (${{ matrix.name }})
    environment: ${{ inputs.environment }}
    needs: [init]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        name: [backend, frontend]
        include:
          - name: backend
            file: backend/openshift.deploy.yml
            # Log levels come from GitHub variables, scoped per environment
            # (test/prod); PR deploys fall back to repo-level variables, then INFO.
            parameters: >-
              -p IMAGE_TAG="${{ inputs.tag }}"
              -p APP_LOG_LEVEL='${{ vars.backend_log_level || 'INFO' }}'
              -p ROOT_LOG_LEVEL='${{ vars.backend_root_log_level || 'INFO' }}'
              -p SPRING_LOG_LEVEL='${{ vars.backend_spring_log_level || 'INFO' }}'
              -p SPRING_SECURITY_LOG_LEVEL='${{ vars.backend_spring_security_log_level || 'WARN' }}'
          # WARNING: vars referenced in this matrix resolve at repo level only —
          # GitHub evaluates strategy/matrix before the job's environment is
          # attached, so environment-scoped (test/prod) variables are ignored
          # here. Anything that differs per environment belongs in the init
          # step's parameters (common/openshift.init.yml), not in this matrix.
          # Auth settings are read from the init-created ConfigMaps, per environment.
          - name: frontend
            file: frontend/openshift.deploy.yml
            parameters: >-
              -p IMAGE_TAG='${{ inputs.tag }}'
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      - uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        id: deploy
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: true
          # Lite mode strips HPA + PDB and scales to 1 replica (Recreate) for PR/sandbox deploys
          lite_mode: ${{ github.event_name == 'pull_request' }}
          parameters:
            -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            -p COMMIT_SHA='${{ github.sha }}'
            ${{ matrix.parameters }}
          triggers: ${{ inputs.triggers }}
