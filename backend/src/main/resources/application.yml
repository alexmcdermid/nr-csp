spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  # ===================================================================
  # Hikari connection pool (Oracle, nrcdb03 over TCPS)
  # Bound in DataSourceConfig; override any knob via
  # SPRING_DATASOURCE_HIKARI_* env vars. keepalive-time pings idle
  # connections so network firewalls between OpenShift and the DB
  # can't silently drop them; max-lifetime recycles connections well
  # inside any server-side idle limit.
  # ===================================================================
  datasource:
    hikari:
      pool-name: csp-backend
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      keepalive-time: 300000
      max-lifetime: 1800000

server:
  servlet:
    context-path: /
  forward-headers-strategy: framework

# ===================================================================
# CSP submission XML validation
# These parameters make the otherwise application-agnostic validation
# pipeline specific to CSP. Defaults live in
# SubmissionValidationProperties; listed here for visibility/override.
# ===================================================================
csp:
  submission:
    validation:
      schema-classpath-root: schemas/csp/
      entry-schema: schemas/csp/mof-csp.xsd
      jaxb-context-path: ca.bc.gov.nrs.csp.backend.invoice.submission.generated
      envelope-namespace: http://www.for.gov.bc.ca/schema/esf
      envelope-root: ESFSubmission
      envelope-content-element: submissionContent
      body-namespace: http://www.for.gov.bc.ca/schema/csp
      body-root: CSPSubmission

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
    url: /api/v3/api-docs
    disable-swagger-default-url: true
    enabled: true

# ===================================================================
# JWT / JWKS Configuration
# ===================================================================
security:
  jwt:
    jwks-uri: ${CSP_OIDC_JWKS_URI:}
    issuer: ${CSP_OIDC_ISSUER_URI:}
    client-id: ${CSP_OIDC_CLIENT_ID:}

# ===================================================================
# Logging — per-package levels (override via env or logging.level.*)
# ===================================================================
logging:
  level:
    root: INFO
    ca.bc.gov.nrs.csp: INFO
    org.springframework: INFO
    org.springframework.security: WARN
    org.apache.coyote.http11.Http11Processor: INFO

---
# Local development profile
# Empty fallbacks let the app boot without SSO configured;
# set the env vars in .env when those integrations are needed.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver

security:
  jwt:
    jwks-uri: ${CSP_OIDC_JWKS_URI:}
    issuer: ${CSP_OIDC_ISSUER_URI:}
    client-id: ${CSP_OIDC_CLIENT_ID:}

auth:
  mock:
    enabled: ${AUTH_MOCK_ENABLED:true}
    username: local-dev-user
    roles: ${AUTH_MOCK_ROLES:ADMIN}

logging:
  level:
    ca.bc.gov.nrs.csp: DEBUG
    org.springframework.security: DEBUG

---
# Production profile (all credentials injected by OpenShift env vars)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

auth:
  mock:
    enabled: false
