apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Product name
    value: nr-csp
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  # ── Backend secrets ───────────────────────────────────────
  - name: SPRING_DATASOURCE_URL
    description: "Full Oracle JDBC URL, e.g. jdbc:oracle:thin:@//host:1543/SERVICE"
    required: true
  - name: SPRING_DATASOURCE_USERNAME
    description: Oracle database username
    required: true
  - name: SPRING_DATASOURCE_PASSWORD
    description: Oracle database password
    required: true
  - name: KEYSTORE_SECRET
    description: Secret used by the Oracle wallet init container
    required: true

  # ── Backend config ────────────────────────────────────────
  - name: DATABASE_HOST
    description: Oracle DB hostname used by the wallet init container
    required: true
  - name: DATABASE_SERVICE_NAME
    description: Oracle service name
    required: true
  - name: SPRING_PROFILES_ACTIVE
    description: Active Spring profile
    value: prod
  - name: JAVA_OPTS
    description: JVM options
    value: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport"
  - name: CSP_OIDC_ISSUER_URI
    description: CSS issuer from this environment's installation JSON
    required: true
  - name: CSP_OIDC_CLIENT_ID
    description: Public CSS client ID (installation JSON resource)
    required: true

  - name: AUTH_MOCK_ENABLED
    description: Set to true to bypass real authentication (local/dev only)
    value: "false"
  - name: AUTH_MOCK_ROLES
    description: Comma-separated roles injected when AUTH_MOCK_ENABLED=true
    value: ""

  # Public browser configuration is generated in the environment-bound init job.
  - name: APP_ENV
    description: Application environment (dev, test, prod)
    value: dev
  - name: OIDC_IDIR_HINT
    value: azureidir
  - name: OIDC_BCEID_HINT
    value: bceidbusiness
  - name: OIDC_SITEMINDER_LOGOUT_URL
    description: Optional SiteMinder logoff override
    value: ""

  - name: FRONTEND_LOG_LEVEL
    description: Caddy runtime log level (DEBUG, INFO, WARN, ERROR)
    value: INFO

objects:
  # ── Backend Secret ────────────────────────────────────────
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-${ZONE}-backend
      labels:
        app: ${NAME}-${ZONE}
    type: Opaque
    stringData:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      KEYSTORE_SECRET: ${KEYSTORE_SECRET}

  # ── Backend ConfigMap ─────────────────────────────────────
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${NAME}-${ZONE}-backend
      labels:
        app: ${NAME}-${ZONE}
    data:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_SERVICE_NAME: ${DATABASE_SERVICE_NAME}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JAVA_OPTS: ${JAVA_OPTS}
      CSP_OIDC_ISSUER_URI: ${CSP_OIDC_ISSUER_URI}
      CSP_OIDC_CLIENT_ID: ${CSP_OIDC_CLIENT_ID}
      AUTH_MOCK_ENABLED: ${AUTH_MOCK_ENABLED}
      AUTH_MOCK_ROLES: ${AUTH_MOCK_ROLES}

  # ── Frontend env ConfigMap (mirrors ${NAME}-${ZONE}-backend) ──
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${NAME}-${ZONE}-frontend
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    data:
      LOG_LEVEL: ${FRONTEND_LOG_LEVEL}
      OIDC_ISSUER_URI: ${CSP_OIDC_ISSUER_URI}

  # ── Frontend OIDC ConfigMap (runtime-injected, overrides the
  #    build-time placeholder; mounted by the frontend Deployment) ──
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${NAME}-frontend-config-${ZONE}
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    data:
      config.js: |
        window.appConfig = {
          mockUser: false,
          appEnv: '${APP_ENV}',
          oidcIssuerUri: '${CSP_OIDC_ISSUER_URI}',
          oidcClientId: '${CSP_OIDC_CLIENT_ID}',
          oidcIdirHint: '${OIDC_IDIR_HINT}',
          oidcBceidHint: '${OIDC_BCEID_HINT}',
          oidcSiteminderLogoutUrl: '${OIDC_SITEMINDER_LOGOUT_URL}',
        };

  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-frontend-${ZONE}-ingress
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      podSelector:
        matchLabels:
          app: ${NAME}-frontend-${ZONE}
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
      policyTypes:
        - Ingress

  # ── NetworkPolicy: ingress from same-zone frontend + cluster monitoring ──
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-backend-${ZONE}-ingress
      labels:
        app: ${NAME}-backend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      podSelector:
        matchLabels:
          app: ${NAME}-backend-${ZONE}
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app: ${NAME}-frontend-${ZONE}
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: monitoring
      policyTypes:
        - Ingress
